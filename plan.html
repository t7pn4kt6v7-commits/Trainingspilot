<!--
  Einstiegsseite für geteilte Trainingspläne (seit v5.207). Sie ist bewusst winzig: Messenger wie WhatsApp
  lesen für die Vorschaukarte diese Seite statt der 1,3 MB großen App. Der Plan steckt weiterhin im Teil
  hinter dem # und wird unverändert an die App (index.html im selben Ordner) weitergereicht.
  pages.yml veröffentlicht diese Datei neben der index.html (Produktiv und Test).
-->
<script>
  // Sofort zur App weiterleiten; den Teil hinter dem # (der Plan) mitnehmen.
  try{ location.replace('./' + location.hash); }catch(e){}
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0F0C;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box;}
  a{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:14px;background:#E8622C;color:#fff;font-weight:700;text-decoration:none;}
</style>
</head>
<body>
<div>
  <p>Trainingsplan wird geöffnet …</p>
  <a id="go" href="./">Trainingspilot öffnen</a>
</div>
<script>
  // Falls die Weiterleitung nicht greift: Der Knopf führt mit Plan zur App.
  try{ document.getElementById('go').href = './' + location.hash; }catch(e){}
</script>
</body>
