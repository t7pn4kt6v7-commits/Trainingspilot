name: Übungsbibliothek und Agent prüfen

on:
  # Läuft auch für *.html und alle Workflows, weil "Veröffentlichen (Produktiv + Test)" erst
  # nach dieser Prüfung startet (siehe pages.yml).
  push:
    paths: ['data/exercises/**', '*.html', 'tools/**', '.github/workflows/**']
  pull_request:
    paths: ['data/exercises/**', '*.html', 'tools/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/exercises.mjs check
      - run: npm ci --prefix tools/agent
      - name: Tests Übungs-Agent (ohne API-Aufrufe)
        run: node tools/agent/test.mjs
