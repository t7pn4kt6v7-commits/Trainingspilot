name: Übungsbibliothek prüfen

on:
  push:
    paths: ['data/exercises/**', 'index.html', 'tools/exercises.mjs', '.github/workflows/exercises.yml']
  pull_request:
    paths: ['data/exercises/**', 'index.html', 'tools/exercises.mjs', '.github/workflows/exercises.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/exercises.mjs check
