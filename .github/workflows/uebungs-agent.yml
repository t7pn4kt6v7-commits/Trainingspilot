name: Übungs-Agent

# Wertet wöchentlich die Rückmeldungs-Issues aus, lässt Claude neue Übungen für die
# dringendsten Bereiche erstellen und öffnet dafür einen Pull Request zur Freigabe.
# Einrichtung: siehe tools/agent/README.md

on:
  schedule:
    - cron: '17 4 * * 1' # montags 04:17 UTC
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Höchstens so viele neue Übungen'
        default: '4'
      dry_run:
        description: 'Probelauf: nur anzeigen, was der Agent tun würde (keine API-Kosten, kein PR)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: uebungs-agent
  cancel-in-progress: false

jobs:
  vorschlaege:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Läuft schon ein offener Agent-PR?
        id: offen
        run: |
          n=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("agent/"))] | length')
          echo "anzahl=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" != "0" ]; then
            echo "Es gibt noch einen offenen Pull Request des Übungs-Agenten - erst prüfen und zusammenführen oder schließen." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.offen.outputs.anzahl == '0'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/agent/package-lock.json

      - name: Abhängigkeiten installieren
        if: steps.offen.outputs.anzahl == '0'
        run: npm ci --prefix tools/agent

      - name: Agent ausführen
        if: steps.offen.outputs.anzahl == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MAX_NEW: ${{ inputs.max_new || '4' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          AGENT_SUMMARY_FILE: ${{ runner.temp }}/pr-text.md
        run: node tools/agent/run.mjs

      - name: Pull Request öffnen
        if: steps.offen.outputs.anzahl == '0' && !inputs.dry_run
        run: |
          if git diff --quiet -- data/exercises index.html; then
            echo "Keine neuen Übungen in diesem Lauf." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node tools/exercises.mjs check
          branch="agent/uebungen-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/exercises index.html
          git commit -m "Übungs-Agent: neue Übungen ($(date -u +%Y-%m-%d))"
          git push -u origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Übungs-Agent: neue Übungen zur Freigabe ($(date -u +%d.%m.%Y))" \
            --body-file "$RUNNER_TEMP/pr-text.md"
          cat "$RUNNER_TEMP/pr-text.md" >> "$GITHUB_STEP_SUMMARY"
